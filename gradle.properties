android.useAndroidX=true
org.gradle.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
kotlin.wasm.stability.nowarn=true

# AGP 9 ships its own Kotlin support and a new DSL, and refuses to sit beside the Kotlin
# Multiplatform plugin until the module moves to com.android.kotlin.multiplatform.library. These
# are AGP's own sanctioned bridge until that migration happens. Kept in step with Calendite-KMP,
# which builds this repo as an included build: a composite build permits exactly one AGP version.
android.builtInKotlin=false
android.newDsl=false
